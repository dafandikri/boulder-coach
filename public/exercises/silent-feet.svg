<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Silent feet drill: place the toe precisely and quietly">
  <rect width="320" height="200" fill="#eef6f0" />
  <!-- wall -->
  <rect x="40" y="24" width="240" height="152" rx="10" fill="#dcebe1" stroke="#a9cdb6" stroke-width="4" />
  <!-- foothold -->
  <circle cx="150" cy="132" r="13" fill="#7cc6a0" stroke="#3f8f66" stroke-width="4" />
  <!-- foot / shoe approaching precisely -->
  <path d="M168 96 l30 6 q10 2 8 12 l-3 14 q-1 8 -10 7 l-30 -4 z" fill="#2f6b4c" />
  <path d="M150 119 l24 -18" stroke="#3f8f66" stroke-width="3" stroke-dasharray="4 5" />
  <text x="160" y="190" text-anchor="middle" font-family="monospace" font-size="12" fill="#3f8f66">place the toe — no sound</text>
</svg>
