<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Band pull-apart: arms straight, pull the band apart, squeeze the shoulder blades">
  <rect width="320" height="200" fill="#f3eefb" />
  <!-- band -->
  <path d="M70 100 q90 -34 180 0" fill="none" stroke="#b79be0" stroke-width="8" stroke-linecap="round" />
  <!-- hands -->
  <circle cx="70" cy="100" r="12" fill="#7a4fc0" />
  <circle cx="250" cy="100" r="12" fill="#7a4fc0" />
  <!-- arrows apart -->
  <path d="M58 130 l-22 0 m0 0 l8 -8 m-8 8 l8 8" stroke="#7a4fc0" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M262 130 l22 0 m0 0 l-8 -8 m8 8 l-8 8" stroke="#7a4fc0" stroke-width="4" fill="none" stroke-linecap="round" />
  <text x="160" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a4fc0">straight arms — squeeze the blades</text>
</svg>
