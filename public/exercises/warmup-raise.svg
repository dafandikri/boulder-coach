<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Raise: 5-10 min easy cardio to lift the heart rate">
  <rect width="320" height="200" fill="#eaf2fb" />
  <!-- track -->
  <rect x="28" y="150" width="264" height="10" rx="5" fill="#bcd6f2" />
  <!-- runner -->
  <circle cx="150" cy="64" r="14" fill="#3f7fcf" />
  <path d="M150 78 l0 36" stroke="#3f7fcf" stroke-width="8" stroke-linecap="round" />
  <path d="M150 88 l-22 14 M150 88 l24 10" stroke="#3f7fcf" stroke-width="8" stroke-linecap="round" />
  <path d="M150 114 l-20 30 M150 114 l22 28" stroke="#2f63a8" stroke-width="8" stroke-linecap="round" />
  <!-- motion -->
  <path d="M70 70 h26 M64 92 h34 M74 114 h22" stroke="#9cc0ec" stroke-width="5" stroke-linecap="round" />
  <text x="160" y="186" text-anchor="middle" font-family="monospace" font-size="12" fill="#2f63a8">easy pace — light sweat</text>
</svg>
