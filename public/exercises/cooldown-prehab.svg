<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Cooldown prehab: light band rotator-cuff, wrist and finger-extensor maintenance">
  <rect width="320" height="200" fill="#eef0f4" />
  <!-- resistance band -->
  <path d="M70 110 q90 -54 180 0" fill="none" stroke="#9aa6bd" stroke-width="8" stroke-linecap="round" />
  <!-- two hands holding the band -->
  <rect x="56" y="98" width="26" height="18" rx="9" fill="#5b6b8c" />
  <rect x="238" y="98" width="26" height="18" rx="9" fill="#5b6b8c" />
  <!-- gentle arrows = controlled tempo -->
  <path d="M96 140 h40 m0 0 l-8 -6 m8 6 l-8 6" stroke="#5b6b8c" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M224 140 h-40 m0 0 l8 -6 m-8 6 l8 6" stroke="#5b6b8c" stroke-width="5" stroke-linecap="round" fill="none" />
  <text x="160" y="186" text-anchor="middle" font-family="monospace" font-size="12" fill="#5b6b8c">light, slow, controlled</text>
</svg>
