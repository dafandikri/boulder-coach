  <!-- shoulder circle -->
  <circle cx="96" cy="96" r="44" fill="none" stroke="#bcd6f2" stroke-width="6" stroke-dasharray="6 8" />
  <path d="M96 52 a44 44 0 0 1 38 22" fill="none" stroke="#3f7fcf" stroke-width="6" stroke-linecap="round" />
  <path d="M134 74 l8 -10 m-8 10 l-12 -2" stroke="#3f7fcf" stroke-width="6" stroke-linecap="round" fill="none" />
  <!-- wrist / hand glide -->
  <rect x="186" y="70" width="14" height="52" rx="7" fill="#3f7fcf" />
  <path d="M200 78 q22 -6 30 8 M200 92 q24 -2 30 12 M200 106 q22 4 28 16" stroke="#2f63a8" stroke-width="6" stroke-linecap="round" fill="none" />
